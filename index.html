
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khammam Live — Version 2</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
:root{--panel:rgba(10,18,29,.91);--accent:#e8a64b;--muted:#bdc8d2}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;color:#fff;font-family:Arial,sans-serif}
#map{position:absolute;inset:0}
.top{position:absolute;z-index:5;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;gap:10px;pointer-events:none}
.brand,.tools,.panel,.search,.bottom{background:var(--panel);border:1px solid #ffffff25;backdrop-filter:blur(14px);border-radius:14px;box-shadow:0 8px 30px #0004}
.brand{padding:12px 16px;pointer-events:auto}
.eyebrow{font-size:10px;letter-spacing:3px;color:var(--accent);font-weight:bold}
h1{font-size:21px;margin:4px 0}
.sub{font-size:11px;color:var(--muted)}
.tools{padding:7px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:auto}
button{background:#ffffff12;color:#fff;border:1px solid #ffffff30;border-radius:9px;padding:9px 11px;font-weight:bold;cursor:pointer}
button:hover,button.active{border-color:var(--accent);background:#e8a64b35}
.search{position:absolute;z-index:5;top:100px;left:14px;padding:8px;display:flex;gap:6px;width:min(350px,calc(100vw - 28px))}
input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#fff;padding:8px;font-size:14px}
input::placeholder{color:var(--muted)}
.panel{position:absolute;z-index:5;right:14px;top:100px;width:230px;padding:13px}
.panel h2{font-size:11px;color:var(--muted);letter-spacing:1px;margin:0 0 9px}
.places{display:grid;gap:6px}
.places button{text-align:left;display:flex;justify-content:space-between;gap:6px}
.places span{font-size:10px;color:var(--muted)}
.weather{font-size:23px;font-weight:bold}
.weather small{display:block;font-size:11px;color:var(--muted);font-weight:normal}
.bottom{position:absolute;z-index:5;bottom:14px;left:14px;right:14px;padding:10px 13px;display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:11px;color:var(--muted)}
.status{color:#8ee0ad}
.drivehelp{display:none}
.drivehelp.show{display:block;color:#ffe0a8}
.maplibregl-ctrl-group{background:#101923dd!important}
.maplibregl-ctrl button span{filter:invert(1)}
@media(max-width:680px){
.top{top:8px;left:8px;right:8px}
.brand{padding:9px}
.brand h1{font-size:17px}
.sub{display:none}
.tools{max-width:55%;gap:4px}
.tools button{padding:7px;font-size:10px}
.search{top:82px;left:8px}
.panel{top:auto;bottom:66px;right:8px;width:200px;padding:10px}
.bottom{bottom:8px;left:8px;right:8px}
.desktopHint{display:none}
}
</style>
</head>
<body>

<div id="map"></div>

<div class="top">
 <div class="brand">
  <div class="eyebrow">TELANGANA · INDIA</div>
  <h1>KHAMMAM LIVE</h1>
  <div class="sub">Version 2 · Explore your city in 3D</div>
 </div>
 <div class="tools">
  <button id="city" class="active">City view</button>
  <button id="street">Street view</button>
  <button id="drive">Drive mode</button>
  <button id="day">Day</button>
  <button id="night">Night</button>
 </div>
</div>

<div class="search">
 <input id="search" placeholder="Search a place in Khammam…">
 <button id="searchBtn">Search</button>
</div>

<aside class="panel">
 <h2>EXPLORE KHAMMAM</h2>
 <div class="places">
  <button data-place="fort">Khammam Fort <span>↗</span></button>
  <button data-place="lake">Lakaram Lake <span>↗</span></button>
  <button data-place="oldbus">Old Bus Station <span>↗</span></button>
  <button data-place="newbus">New Bus Station <span>↗</span></button>
  <button data-place="station">Railway Station <span>↗</span></button>
 </div>
 <hr style="border:0;border-top:1px solid #ffffff25;margin:12px 0">
 <h2>LOCAL WEATHER</h2>
 <div class="weather">
  <span id="weatherIcon">☀️</span>
  <span id="temp">--°</span>
  <small id="weatherText">Loading…</small>
 </div>
</aside>

<div class="bottom">
 <div><span class="status">●</span> Khammam, Telangana · <span id="coords">17.2490° N, 80.1450° E</span></div>
 <div class="desktopHint">Drag to move · Right-drag to rotate · Scroll to zoom</div>
 <div id="drivehelp" class="drivehelp">Drive mode: use W/A/S/D or arrow keys · Exit with Drive mode</div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const center=[80.1450,17.2490];

const places={
 fort:{name:"Khammam Fort",center:[80.14588,17.24629],zoom:17},
 lake:{name:"Lakaram Lake",center:[80.15903,17.24811],zoom:16.5},
 oldbus:{name:"TSRTC Old City Bus Station",center:[80.14227,17.25082],zoom:17},
 newbus:{name:"TGSRTC New Bus Station",center:[80.14956,17.26095],zoom:17},
 station:{name:"Khammam Railway Station",center:[80.138491,17.249347],zoom:17}
};

const map=new maplibregl.Map({
 container:"map",
 style:"https://tiles.openfreemap.org/styles/liberty",
 center,
 zoom:13.5,
 pitch:58,
 bearing:-18,
 antialias:true
});

map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),"bottom-right");
map.addControl(new maplibregl.ScaleControl({unit:"metric"}),"bottom-left");

let driveMode=false,car=[...center],heading=0,carMarker=null;

map.on("load",()=>{
 Object.entries(places).forEach(([key,p])=>{
  new maplibregl.Marker({color:"#e8a64b"})
   .setLngLat(p.center)
   .setPopup(new maplibregl.Popup().setText(p.name))
   .addTo(map);
 });

 const style=map.getStyle();
 const building=style.layers.find(l=>
  l.type==="fill" && /building/i.test(l.id) && l.source && l["source-layer"]
 );

 if(building){
  map.addLayer({
   id:"khammam-v2-3d-buildings",
   source:building.source,
   "source-layer":building["source-layer"],
   type:"fill-extrusion",
   minzoom:13,
   filter:building.filter||["all"],
   paint:{
    "fill-extrusion-color":[
     "interpolate",["linear"],
     ["coalesce",["get","render_height"],["get","height"],8],
     0,"#aab6bf",80,"#637889"
    ],
    "fill-extrusion-height":["coalesce",["get","render_height"],["get","height"],8],
    "fill-extrusion-base":["coalesce",["get","render_min_height"],0],
    "fill-extrusion-opacity":.88
   }
  });
 }
});

document.querySelectorAll("[data-place]").forEach(b=>{
 b.onclick=()=>{
  const p=places[b.dataset.place];
  map.flyTo({
   center:p.center,
   zoom:p.zoom,
   pitch:62,
   bearing:-20,
   duration:1700
  });
 };
});

document.getElementById("city").onclick=()=>{
 stopDrive();
 map.flyTo({center,zoom:13.5,pitch:58,bearing:-18,duration:1400});
 setActive("city");
};

document.getElementById("street").onclick=()=>{
 stopDrive();
 map.flyTo({center,zoom:18.3,pitch:75,bearing:0,duration:1700});
 setActive("street");
};

function setActive(id){
 ["city","street","drive"].forEach(x=>
  document.getElementById(x).classList.toggle("active",x===id)
 );
}

document.getElementById("day").onclick=()=>{
 map.easeTo({pitch:58,brightness:1});
};

document.getElementById("night").onclick=()=>{
 map.easeTo({pitch:65,brightness:.65});
};

function startDrive(){
 driveMode=true;
 car=[...center];
 heading=0;
 setActive("drive");

 map.flyTo({
  center:car,
  zoom:18.5,
  pitch:78,
  bearing:heading,
  duration:1200
 });

 document.getElementById("drivehelp").classList.add("show");

 if(!carMarker){
  carMarker=new maplibregl.Marker({color:"#35c98a"})
   .setLngLat(car)
   .addTo(map);
 }

 carMarker.setLngLat(car);
}

function stopDrive(){
 driveMode=false;
 setActive("city");
 document.getElementById("drivehelp").classList.remove("show");
}

document.getElementById("drive").onclick=()=>{
 driveMode?stopDrive():startDrive();
};

document.addEventListener("keydown",e=>{
 if(!driveMode)return;

 const k=e.key.toLowerCase();

 if(!["w","a","s","d","arrowup","arrowdown","arrowleft","arrowright"].includes(k))return;

 e.preventDefault();

 if(k==="a"||k==="arrowleft")heading-=12;
 if(k==="d"||k==="arrowright")heading+=12;

 const distance=(k==="s"||k==="arrowdown")?-0.00012:
 ((k==="w"||k==="arrowup")?0.00012:0);

 const rad=heading*Math.PI/180;

 car[0]+=Math.sin(rad)*distance;
 car[1]+=Math.cos(rad)*distance;

 carMarker.setLngLat(car);

 map.easeTo({
  center:car,
  bearing:heading,
  duration:250
 });
});

async function searchPlace(){
 const q=document.getElementById("search").value.trim();

 if(!q)return;

 try{
  const r=await fetch(
   "https://nominatim.openstreetmap.org/search?format=json&limit=1&q="+
   encodeURIComponent(q+", Khammam, Telangana, India"),
   {headers:{"Accept-Language":"en"}}
  );

  const d=await r.json();

  if(!d.length){
   alert("Place not found. Try another search.");
   return;
  }

  const xy=[+d[0].lon,+d[0].lat];

  map.flyTo({
   center:xy,
   zoom:17,
   pitch:62,
   duration:1500
  });

  new maplibregl.Marker({color:"#58c99b"})
   .setLngLat(xy)
   .setPopup(new maplibregl.Popup().setText(d[0].display_name))
   .addTo(map)
   .togglePopup();

 }catch(e){
  alert("Search is temporarily unavailable.");
 }
}

document.getElementById("searchBtn").onclick=searchPlace;

document.getElementById("search").addEventListener("keydown",e=>{
 if(e.key==="Enter")searchPlace();
});

async function loadWeather(){
 try{
  const r=await fetch(
   "https://api.open-meteo.com/v1/forecast?latitude=17.2490&longitude=80.1450&current=temperature_2m,weather_code&timezone=Asia%2FKolkata"
  );

  const d=await r.json();
  const t=d.current.temperature_2m;
  const c=d.current.weather_code;

  let label="Clear sky",icon="☀️";

  if(c>=1&&c<=3){label="Partly cloudy";icon="⛅";}
  else if(c>=45&&c<=48){label="Fog";icon="🌫️";}
  else if(c>=51&&c<=67){label="Rain";icon="🌧️";}
  else if(c>=71&&c<=77){label="Snow";icon="❄️";}
  else if(c>=80&&c<=82){label="Showers";icon="🌦️";}
  else if(c>=95){label="Thunderstorm";icon="⛈️";}

  document.getElementById("temp").textContent=Math.round(t)+"°";
  document.getElementById("weatherText").textContent=label+" · Khammam";
  document.getElementById("weatherIcon").textContent=icon;

 }catch(e){
  document.getElementById("weatherText").textContent="Weather unavailable";
 }
}

loadWeather();
</script>
</body>
</html>
