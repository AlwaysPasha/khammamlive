<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Khammam Live — Explore the city in 3D</title>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
  <style>
    :root { color-scheme: dark; --panel:rgba(12,19,29,.88); --line:rgba(255,255,255,.13); --muted:#aebdcb; --accent:#e8a64b; }
    * { box-sizing:border-box } html,body { margin:0;width:100%;height:100%;overflow:hidden;background:#101820;color:#f7f8fa;font:14px/1.4 Inter,system-ui,Arial,sans-serif }
    #map { position:absolute;inset:0 }
    .topbar { position:absolute;z-index:2;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none }
    .brand,.tools,.panel,.searchwrap,.placebar { background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(16px);box-shadow:0 10px 35px #0005;border-radius:16px }
    .brand { padding:13px 17px;pointer-events:auto }
    .eyebrow { color:var(--accent);font-size:10px;letter-spacing:.19em;font-weight:800;text-transform:uppercase }
    h1 { margin:2px 0 0;font-size:21px;letter-spacing:-.04em }
    .sub { color:var(--muted);font-size:11px;margin-top:2px }
    .tools { display:flex;gap:7px;padding:7px;pointer-events:auto;flex-wrap:wrap }
    button { cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#ffffff0d;color:#fff;font-weight:650 }
    button:hover,button.active { background:#e8a64b24;border-color:#e8a64b99 }
    .searchwrap { position:absolute;z-index:2;top:102px;left:16px;width:min(350px,calc(100vw - 32px));padding:9px;display:flex;gap:7px }
    input { min-width:0;flex:1;background:transparent;border:0;outline:0;color:white;padding:7px;font:inherit }
    input::placeholder { color:#aebdcb }
    .panel { position:absolute;z-index:2;right:16px;top:102px;width:230px;padding:15px }
    .panel h2 {font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0 0 10px}
    .weather {display:flex;align-items:center;gap:10px;font-size:25px;font-weight:750}
    .weather small {display:block;font-size:11px;color:var(--muted);font-weight:500}
    .places {display:grid;gap:7px}
    .places button {text-align:left;display:flex;justify-content:space-between;align-items:center}
    .places span {color:var(--muted);font-size:10px}
    .bottom {position:absolute;z-index:2;bottom:16px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:end;gap:12px;pointer-events:none}
    .placebar {padding:10px 13px;color:var(--muted);font-size:11px;pointer-events:auto}
    .hint {background:#0c131dcc;border:1px solid var(--line);border-radius:12px;padding:10px 13px;color:var(--muted);font-size:11px;pointer-events:auto}
    .status {color:#b9d6c5}
    .maplibregl-ctrl-group {background:#101923dd!important;border:1px solid var(--line)!important}
    .maplibregl-ctrl button span {filter:invert(1)}
    @media(max-width:650px){.topbar{top:10px;left:10px;right:10px}.brand{padding:10px 12px}h1{font-size:17px}.sub{display:none}.tools{max-width:48%;gap:5px}.tools button{padding:8px;font-size:11px}.searchwrap{top:82px;left:10px}.panel{top:auto;bottom:74px;right:10px;width:190px;padding:11px}.bottom{left:10px;right:10px;bottom:10px}.hint{display:none}}
  </style>
</head>
<body>
<div id="map"></div>
<div class="topbar">
  <div class="brand"><div class="eyebrow">TELANGANA · INDIA</div><h1>KHAMMAM, LIVE</h1><div class="sub">Explore the city · Streets, landmarks & places</div></div>
  <div class="tools">
    <button id="tilt" class="active">3D view</button>
    <button id="day">Day</button><button id="night">Night</button>
    <button id="home">⌂</button>
  </div>
</div>
<div class="searchwrap">
  <input id="search" placeholder="Search places, roads and landmarks…" aria-label="Search places">
  <button id="searchBtn">Search</button>
</div>
<aside class="panel">
  <h2>Khammam highlights</h2>
  <div class="places">
    <button data-place="fort">Khammam Fort <span>Explore ↗</span></button>
    <button data-place="lake">Lakaram Lake <span>Explore ↗</span></button>
    <button data-place="bus">Khammam Bus Station <span>Explore ↗</span></button>
    <button data-place="station">Khammam Railway Station <span>Explore ↗</span></button>
  </div>
  <hr style="border:0;border-top:1px solid var(--line);margin:13px 0">
  <h2>Local weather</h2>
  <div class="weather"><span id="weatherIcon">☀️</span><div><span id="temp">--°</span><small id="weatherText">Loading weather…</small></div></div>
</aside>
<div class="bottom">
  <div class="placebar"><span class="status">●</span> &nbsp; Khammam city · <span id="coords">17.2473° N, 80.1514° E</span></div>
  <div class="hint">Drag to move · Right-drag to turn · Scroll to zoom</div>
</div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const center = [80.1514, 17.2473];
const places = {
  fort: {name:"Khammam Fort", center:[80.1438,17.2497], zoom:16.8},
  lake: {name:"Lakaram Lake", center:[80.1604,17.2536], zoom:16.5},
  bus: {name:"Khammam Bus Station", center:[80.1458,17.2460], zoom:16.5},
  station: {name:"Khammam Railway Station", center:[80.1375,17.2510], zoom:16.5}
};
const map = new maplibregl.Map({
  container:"map",
  style:"https://tiles.openfreemap.org/styles/liberty",
  center, zoom:13.2, pitch:58, bearing:-18, antialias:true
});
map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),"bottom-right");
map.addControl(new maplibregl.ScaleControl({maxWidth:100,unit:"metric"}),"bottom-left");
map.on("load",()=>{
  // Extrude mapped buildings where the style exposes building footprints.
  const layers = map.getStyle().layers || [];
  const building = layers.find(l => l.id.toLowerCase().includes("building") && l.type === "fill");
  if (building) {
    map.addLayer({id:"khammam-3d-buildings",source:building.source,"source-layer":building["source-layer"],filter:building.filter || ["all"],type:"fill-extrusion",minzoom:14,
      paint:{"fill-extrusion-color":["interpolate",["linear"],["get","render_height"],0,"#a9b5bd",80,"#657887"],
      "fill-extrusion-height":["coalesce",["get","render_height"],["get","height"],8],
      "fill-extrusion-base":["coalesce",["get","render_min_height"],0],"fill-extrusion-opacity":0.82}});
    map.moveLayer("khammam-3d-buildings");
  }
  Object.entries(places).forEach(([key,p])=>{
    new maplibregl.Marker({color:"#e8a64b"}).setLngLat(p.center).setPopup(new maplibregl.Popup().setText(p.name)).addTo(map);
  });
});
document.querySelectorAll("[data-place]").forEach(b=>b.addEventListener("click",()=>{
  const p=places[b.dataset.place]; map.flyTo({center:p.center,zoom:p.zoom,pitch:62,bearing:-22,duration:1800});
}));
document.getElementById("home").onclick=()=>map.flyTo({center,zoom:13.2,pitch:58,bearing:-18,duration:1600});
document.getElementById("tilt").onclick=()=>{const p=map.getPitch()>30?0:58;map.easeTo({pitch:p,duration:900});document.getElementById("tilt").classList.toggle("active",p>30)};
document.getElementById("day").onclick=()=>{map.setPaintProperty("background","background-color","#dce5e8");map.easeTo({pitch:58})};
document.getElementById("night").onclick=()=>{map.setPaintProperty("background","background-color","#101a2a");map.easeTo({pitch:62})};
async function searchPlace(){
  const q=document.getElementById("search").value.trim(); if(!q)return;
  try{
    const url="https://nominatim.openstreetmap.org/search?format=json&limit=1&q="+encodeURIComponent(q+", Khammam, Telangana, India");
    const r=await fetch(url,{headers:{"Accept-Language":"en"}}); const data=await r.json();
    if(!data.length){alert("No matching place found. Try another search.");return}
    const d=data[0];map.flyTo({center:[+d.lon,+d.lat],zoom:16.5,pitch:58,duration:1600});
    new maplibregl.Marker({color:"#58c99b"}).setLngLat([+d.lon,+d.lat]).setPopup(new maplibregl.Popup().setText(d.display_name)).addTo(map).togglePopup();
  }catch(e){alert("Search is temporarily unavailable.")}
}
document.getElementById("searchBtn").onclick=searchPlace;
document.getElementById("search").addEventListener("keydown",e=>{if(e.key==="Enter")searchPlace()});
async function loadWeather(){
 try{
  const r=await fetch("https://api.open-meteo.com/v1/forecast?latitude=17.2473&longitude=80.1514&current=temperature_2m,weather_code&timezone=Asia%2FKolkata");
  const d=await r.json(), t=d.current.temperature_2m, c=d.current.weather_code;
  const label=c===0?"Clear sky":c<=3?"Partly cloudy":c<=48?"Fog":c<=67?"Rain":c<=77?"Snow":c<=82?"Showers":"Thunderstorm";
  document.getElementById("temp").textContent=Math.round(t)+"°";
  document.getElementById("weatherText").textContent=label+" · Khammam";
  document.getElementById("weatherIcon").textContent=c===0?"☀️":c<=3?"⛅":c<=67?"🌧️":"⛈️";
 }catch(e){document.getElementById("weatherText").textContent="Weather unavailable"}
}
loadWeather();
</script>
</body>
</html>
