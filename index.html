
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khammam Live | Telangana</title>

<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">

<style>
:root {
  --panel: rgba(12,19,29,.90);
  --accent: #e8a64b;
  --muted: #aebdcb;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #101820;
  color: white;
  font-family: Arial, sans-serif;
}

#map {
  position: absolute;
  inset: 0;
}

.topbar {
  position: absolute;
  z-index: 5;
  top: 16px;
  left: 16px;
  right: 16px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
  pointer-events: none;
}

.brand, .tools, .panel, .searchwrap, .placebar {
  background: var(--panel);
  border: 1px solid #ffffff25;
  backdrop-filter: blur(14px);
  border-radius: 14px;
}

.brand {
  padding: 13px 17px;
  pointer-events: auto;
}

.eyebrow {
  color: var(--accent);
  font-size: 10px;
  letter-spacing: 3px;
  font-weight: bold;
}

h1 {
  margin: 4px 0;
  font-size: 22px;
}

.sub {
  color: var(--muted);
  font-size: 11px;
}

.tools {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 7px;
  pointer-events: auto;
}

button {
  cursor: pointer;
  padding: 9px 12px;
  border: 1px solid #ffffff25;
  border-radius: 9px;
  background: #ffffff12;
  color: white;
  font-weight: bold;
}

button:hover, button.active {
  background: #e8a64b35;
  border-color: var(--accent);
}

.searchwrap {
  position: absolute;
  z-index: 5;
  top: 105px;
  left: 16px;
  width: min(350px, calc(100vw - 32px));
  padding: 9px;
  display: flex;
  gap: 7px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 8px;
  color: white;
  background: transparent;
  border: 0;
  outline: none;
  font-size: 14px;
}

input::placeholder { color: var(--muted); }

.panel {
  position: absolute;
  z-index: 5;
  top: 105px;
  right: 16px;
  width: 245px;
  padding: 14px;
}

.panel h2 {
  font-size: 12px;
  color: var(--muted);
  letter-spacing: 1px;
  margin: 0 0 10px;
}

.places {
  display: grid;
  gap: 7px;
}

.places button {
  text-align: left;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.places span {
  font-size: 10px;
  color: var(--muted);
}

.weather {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 24px;
  font-weight: bold;
}

.weather small {
  display: block;
  font-size: 11px;
  color: var(--muted);
  font-weight: normal;
}

.bottom {
  position: absolute;
  z-index: 5;
  bottom: 16px;
  left: 16px;
  right: 16px;
  display: flex;
  justify-content: space-between;
  align-items: end;
  pointer-events: none;
}

.placebar, .hint {
  padding: 10px 13px;
  font-size: 11px;
  color: var(--muted);
  pointer-events: auto;
}

.hint {
  background: var(--panel);
  border-radius: 10px;
}

.maplibregl-ctrl-group {
  background: #101923dd !important;
}

@media(max-width:650px) {
  .topbar { top: 9px; left: 9px; right: 9px; }
  .brand { padding: 10px; }
  h1 { font-size: 17px; }
  .sub { display: none; }
  .tools { max-width: 50%; }
  .tools button { padding: 7px; font-size: 10px; }
  .searchwrap { top: 85px; left: 9px; }
  .panel {
    top: auto;
    bottom: 70px;
    right: 9px;
    width: 205px;
    padding: 10px;
  }
  .bottom { bottom: 9px; left: 9px; right: 9px; }
  .hint { display: none; }
}
</style>
</head>

<body>

<div id="map"></div>

<div class="topbar">
  <div class="brand">
    <div class="eyebrow">TELANGANA · INDIA</div>
    <h1>KHAMMAM LIVE</h1>
    <div class="sub">Explore the city · Streets and landmarks</div>
  </div>

  <div class="tools">
    <button id="tilt" class="active">3D View</button>
    <button id="day">Day</button>
    <button id="night">Night</button>
    <button id="home">⌂ Home</button>
  </div>
</div>

<div class="searchwrap">
  <input id="search" placeholder="Search Khammam locations...">
  <button id="searchBtn">Search</button>
</div>

<aside class="panel">
  <h2>KHAMMAM HIGHLIGHTS</h2>

  <div class="places">
    <button data-place="fort">
      Khammam Fort <span>Explore ↗</span>
    </button>

    <button data-place="lake">
      Lakaram Lake <span>Explore ↗</span>
    </button>

    <button data-place="oldbus">
      Old Bus Station <span>Explore ↗</span>
    </button>

    <button data-place="newbus">
      New Bus Station <span>Explore ↗</span>
    </button>

    <button data-place="station">
      Railway Station <span>Explore ↗</span>
    </button>
  </div>

  <hr style="border:0;border-top:1px solid #ffffff25;margin:14px 0">

  <h2>LOCAL WEATHER</h2>

  <div class="weather">
    <span id="weatherIcon">☀️</span>
    <div>
      <span id="temp">--°</span>
      <small id="weatherText">Loading weather...</small>
    </div>
  </div>
</aside>

<div class="bottom">
  <div class="placebar">
    ● Khammam, Telangana
    <span id="coords">17.2490° N, 80.1450° E</span>
  </div>
  <div class="hint">
    Drag to move · Right click to rotate · Scroll to zoom
  </div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

<script>

// KHAMMAM CITY CENTRE
const center = [80.1450, 17.2490];

// VERIFIED MAP-DATABASE LANDMARK COORDINATES
// Coordinates are [longitude, latitude].

const places = {

  fort: {
    name: "Khammam Fort",
    center: [80.14588, 17.24629],
    zoom: 17
  },

  lake: {
    name: "Lakaram Lake",
    center: [80.15903, 17.24811],
    zoom: 16.5
  },

  oldbus: {
    name: "TSRTC Old City Bus Station",
    center: [80.14227, 17.25082],
    zoom: 17
  },

  newbus: {
    name: "TGSRTC New Bus Station",
    center: [80.14956, 17.26095],
    zoom: 17
  },

  station: {
    name: "Khammam Railway Station",
    center: [80.138491, 17.249347],
    zoom: 17
  }

};

// CREATE MAP
const map = new maplibregl.Map({
  container: "map",
  style: "https://tiles.openfreemap.org/styles/liberty",
  center: center,
  zoom: 13.5,
  pitch: 55,
  bearing: -18,
  antialias: true
});

map.addControl(
  new maplibregl.NavigationControl({
    visualizePitch: true
  }),
  "bottom-right"
);

map.addControl(
  new maplibregl.ScaleControl({
    maxWidth: 100,
    unit: "metric"
  }),
  "bottom-left"
);

// ADD LANDMARK MARKERS
map.on("load", () => {

  Object.entries(places).forEach(([key, place]) => {

    const marker = new maplibregl.Marker({
      color: "#e8a64b"
    })
    .setLngLat(place.center)
    .setPopup(
      new maplibregl.Popup().setText(place.name)
    )
    .addTo(map);

  });

  // 3D BUILDINGS WHERE THE MAP DATA PROVIDES THEM
  const layers = map.getStyle().layers || [];

  const building = layers.find(layer =>
    layer.id.toLowerCase().includes("building") &&
    layer.type === "fill" &&
    layer.source &&
    layer["source-layer"]
  );

  if (building && !map.getLayer("khammam-3d-buildings")) {

    map.addLayer({
      id: "khammam-3d-buildings",
      source: building.source,
      "source-layer": building["source-layer"],
      type: "fill-extrusion",
      minzoom: 14,

      paint: {
        "fill-extrusion-color": "#8799a8",
        "fill-extrusion-height": [
          "coalesce",
          ["get", "render_height"],
          ["get", "height"],
          8
        ],
        "fill-extrusion-base": [
          "coalesce",
          ["get", "render_min_height"],
          0
        ],
        "fill-extrusion-opacity": 0.85
      }

    });

  }

});

// LANDMARK NAVIGATION
document.querySelectorAll("[data-place]").forEach(button => {

  button.addEventListener("click", () => {

    const place = places[button.dataset.place];

    map.flyTo({
      center: place.center,
      zoom: place.zoom,
      pitch: 60,
      bearing: -20,
      duration: 1800
    });

  });

});

// HOME BUTTON
document.getElementById("home").onclick = () => {

  map.flyTo({
    center: center,
    zoom: 13.5,
    pitch: 55,
    bearing: -18,
    duration: 1500
  });

};

// 3D VIEW
document.getElementById("tilt").onclick = () => {

  const pitch = map.getPitch() > 30 ? 0 : 55;

  map.easeTo({
    pitch: pitch,
    duration: 900
  });

  document.getElementById("tilt")
    .classList.toggle("active", pitch > 30);

};

// DAY / NIGHT MAP STYLE
function setMapTheme(theme) {

  const background = map.getStyle().layers.find(
    layer => layer.type === "background"
  );

  if (background) {
    map.setPaintProperty(
      background.id,
      "background-color",
      theme === "night" ? "#101a2a" : "#dce5e8"
    );
  }

}

document.getElementById("day").onclick = () => {
  setMapTheme("day");
};

document.getElementById("night").onclick = () => {
  setMapTheme("night");
};

// LOCATION SEARCH
async function searchPlace() {

  const query = document.getElementById("search").value.trim();

  if (!query) return;

  try {

    const url =
      "https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" +
      encodeURIComponent(query + ", Khammam, Telangana, India");

    const response = await fetch(url, {
      headers: {
        "Accept-Language": "en"
      }
    });

    const results = await response.json();

    if (!results.length) {
      alert("Location not found. Try another search.");
      return;
    }

    const result = results[0];

    const location = [
      Number(result.lon),
      Number(result.lat)
    ];

    map.flyTo({
      center: location,
      zoom: 17,
      pitch: 55,
      duration: 1500
    });

    new maplibregl.Marker({
      color: "#58c99b"
    })
    .setLngLat(location)
    .setPopup(
      new maplibregl.Popup().setText(result.display_name)
    )
    .addTo(map)
    .togglePopup();

  } catch (error) {

    alert("Search is temporarily unavailable.");

  }

}

document.getElementById("searchBtn").onclick = searchPlace;

document.getElementById("search").addEventListener(
  "keydown",
  event => {
    if (event.key === "Enter") searchPlace();
  }
);

// KHAMMAM WEATHER
async function loadWeather() {

  try {

    const response = await fetch(
      "https://api.open-meteo.com/v1/forecast?latitude=17.2490&longitude=80.1450&current=temperature_2m,weather_code&timezone=Asia%2FKolkata"
    );

    const data = await response.json();

    const temperature = data.current.temperature_2m;
    const code = data.current.weather_code;

    let description = "Clear sky";
    let icon = "☀️";

    if (code >= 1 && code <= 3) {
      description = "Partly cloudy";
      icon = "⛅";
    } else if (code >= 45 && code <= 48) {
      description = "Fog";
      icon = "🌫️";
    } else if (code >= 51 && code <= 67) {
      description = "Rain";
      icon = "🌧️";
    } else if (code >= 71 && code <= 77) {
      description = "Snow";
      icon = "❄️";
    } else if (code >= 80 && code <= 82) {
      description = "Showers";
      icon = "🌦️";
    } else if (code >= 95) {
      description = "Thunderstorm";
      icon = "⛈️";
    }

    document.getElementById("temp").textContent =
      Math.round(temperature) + "°";

    document.getElementById("weatherText").textContent =
      description + " · Khammam";

    document.getElementById("weatherIcon").textContent = icon;

  } catch (error) {

    document.getElementById("weatherText").textContent =
      "Weather unavailable";

  }

}

loadWeather();

</script>

</body>
</html>
